[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
authors = ["robin-thoene"]
license = "MIT"
repository = "https://github.com/robin-thoene/wiretui"

[workspace.dependencies]
# Internal
adapters = { path = "./crates/adapters", package = "wiretui-adapters" }
application = { path = "./crates/application", package = "wiretui-application" }
domain = { path = "./crates/domain", package = "wiretui-domain" }
ports = { path = "./crates/ports", package = "wiretui-ports" }
# External
env_logger = "0.11.10"
log = "0.4.29"
crossterm = "0.29.0"
ratatui = "0.30.0"
ratatui-textarea = "0.9.1"
zbus = "5.15.0"
serde = "1.0.228"
